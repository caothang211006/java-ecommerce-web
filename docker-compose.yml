services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ProductIntro_WS2_ThangNDC_SE203709
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ProductIntro_WS2_ThangNDC_SE203709
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      PORT: 8080
    ports:
      # host:container. Host side is 8081 so this can run alongside a local
      # Tomcat (NetBeans) already holding 8080. App is at http://localhost:8081
      - "8081:8080"

volumes:
  mysql-data:
